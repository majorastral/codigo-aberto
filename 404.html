<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Código Aberto</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root{--red:#ea1d2c;--red-deep:#b3141f;--ink:#161412;--cream:#faf6ee;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:Archivo,Arial,Helvetica,sans-serif;padding:24px;}
  main{max-width:520px;text-align:center;}
  .code{font-family:Anton,Impact,'Arial Narrow Bold',sans-serif;font-size:96px;line-height:1;color:var(--red-deep);}
  h1{font-size:28px;font-weight:800;margin:12px 0;}
  p{font-size:17px;line-height:1.6;margin:0 0 24px;}
  a{display:inline-block;background:var(--red-deep);color:#fff;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:999px;}
  a:hover{background:var(--ink);}
  a:focus-visible{outline:3px solid #1c63d9;outline-offset:3px;}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Esta página não existe</h1>
  <p>O endereço pode ter mudado ou ter sido digitado errado. Volte ao início para conhecer o livro.</p>
  <a href="/">Ir para o início</a>
</main>
</body>
</html>
